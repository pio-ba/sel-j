name: Run tests and publish Allure report

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '00 20 * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: allure-history
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Download previous Allure history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p target/allure-results/history
          mkdir -p history-download

          ARTIFACT_ID=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/artifacts" \
              --jq '.artifacts
                | map(select(.name == "allure-results-history" and .expired == false))
                | sort_by(.created_at)
                | reverse
                | .[0].id // empty'
          )

          if [ -n "$ARTIFACT_ID" ]; then
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
              > history-download/history.zip

            unzip -o history-download/history.zip -d history-download
            cp -R history-download/. target/allure-results/history/
          fi

      - name: Run Maven tests
        continue-on-error: true
        run: mvn -B -Dmaven.test.failure.ignore=true test

      - name: Generate Allure report
        run: mvn -B allure:report

      - name: Upload Allure history for next runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-history
          path: target/site/allure-maven-plugin/history
          if-no-files-found: warn
          retention-days: 90

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 30

      - name: Upload HTML Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: error
          retention-days: 30

  deploy-pages:
    needs: test
    if: |
      always() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: public

      - name: Move report to Pages root
        shell: bash
        run: |
          if [ -d public/allure-maven-plugin ]; then
            cp -R public/allure-maven-plugin/. public/
            rm -rf public/allure-maven-plugin
          fi
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4