name: Run tests and publish Allure report

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '00 20 * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: allure-history-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Restore Allure 3 report history
        id: restore-allure-history
        uses: actions/cache/restore@v4
        with:
          path: .allure/history/report/history.jsonl
          key: allure-history-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-

      - name: Verify restored Allure history
        shell: bash
        run: |
          mkdir -p .allure/history/report
          if [ -f .allure/history/report/history.jsonl ]; then
            echo "Restored Allure history:"
            wc -l .allure/history/report/history.jsonl
          else
            echo "No previous Allure history found; this run creates the first history entry."
          fi

      - name: Run Maven tests
        continue-on-error: true
        run: mvn -B -Dmaven.test.failure.ignore=true test

      - name: Generate Allure report
        run: mvn -B -Dallure.history.enabled=true allure:report

      - name: Verify generated Allure history
        if: always()
        shell: bash
        run: |
          HISTORY_FILE=.allure/history/report/history.jsonl
          if [ -f "$HISTORY_FILE" ]; then
            echo "Allure 3 history was generated: $HISTORY_FILE"
            wc -l "$HISTORY_FILE"
          else
            echo "Allure 3 history file is missing: $HISTORY_FILE"
            exit 1
          fi

      - name: Save Allure 3 report history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .allure/history/report/history.jsonl
          key: allure-history-${{ github.ref_name }}-${{ github.run_number }}

      - name: Upload Allure history for backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: .allure/history/report/history.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 30

      - name: Upload HTML Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: error
          retention-days: 30

  deploy-pages:
    needs: test
    if: |
      always() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: public

      - name: Move report to Pages root
        shell: bash
        run: |
          if [ -d public/allure-maven-plugin ]; then
            cp -R public/allure-maven-plugin/. public/
            rm -rf public/allure-maven-plugin
          fi
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4